<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUDA IMAGE LAB - GPU-Accelerated Image Enhancement</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-light">
  <header class="py-3 px-4 border-bottom border-secondary d-flex justify-content-between align-items-center">
    <div>
      <h3 class="mb-0 fw-bold text-gradient">CUDA IMAGE LAB</h3>
      <small class="text-secondary">GPU-Accelerated Image Enhancement and Performance Analysis</small>
    </div>
    <div id="device-badge" class="badge bg-secondary px-3 py-2">
      Hardware: Detecting...
    </div>
  </header>

  <main class="container-fluid my-4">
    <div class="row g-4">
      <!-- Sidebar Controls -->
      <div class="col-lg-4">
        <div class="card bg-dark-subtle border-secondary p-3">
          <h5 class="fw-bold mb-3">Enhancement Controls</h5>
          
          <div class="mb-3">
            <label class="form-label">Upload Image</label>
            <input type="file" id="imageInput" class="form-control" accept="image/png, image/jpeg, image/tiff">
          </div>

          <div class="mb-3">
            <label class="form-label">Algorithm</label>
            <select id="algorithmSelect" class="form-select">
              <option value="full_pipeline" selected>Complete 7-Step Pipeline (Recommended)</option>
              <option value="gaussian">5x5 Gaussian Denoising</option>
              <option value="hist_eq">Histogram Equalization</option>
              <option value="sharpen">Unsharp-Mask Sharpening</option>
              <option value="gamma">Gamma Correction</option>
              <option value="sobel">Sobel Edge Detection</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Target Engine</label>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-info active flex-fill" id="btn-device-auto">Auto (CUDA / CPU)</button>
              <button class="btn btn-outline-primary flex-fill" id="btn-device-cuda">Force CUDA</button>
              <button class="btn btn-outline-secondary flex-fill" id="btn-device-cpu">Force CPU</button>
            </div>
          </div>

          <div class="mb-3 form-check form-switch">
            <input class="form-check-input" type="checkbox" id="sharedMemToggle" checked>
            <label class="form-check-label" for="sharedMemToggle">Use Shared-Memory Tiling (20x20 Tile)</label>
          </div>

          <div class="mb-3">
            <label class="form-label">Gamma: <span id="gammaVal">0.6</span></label>
            <input type="range" id="gammaRange" class="form-range" min="0.1" max="2.5" step="0.05" value="0.6">
          </div>

          <div class="mb-3">
            <label class="form-label">Sharpen Amount: <span id="sharpVal">1.5</span></label>
            <input type="range" id="sharpRange" class="form-range" min="0.5" max="3.0" step="0.1" value="1.5">
          </div>

          <button id="runBtn" class="btn btn-primary w-100 fw-bold py-2 mb-2">Run Enhancement</button>
          <button id="benchmarkBtn" class="btn btn-outline-warning w-100 py-2">Run Benchmark (512x512)</button>
        </div>
      </div>

      <!-- Main Display -->
      <div class="col-lg-8">
        <div class="card bg-dark-subtle border-secondary p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">Image Comparison</h5>
            <div id="metricsBar" class="text-secondary small">Ready</div>
          </div>

          <div class="row g-3">
            <div class="col-md-6 text-center">
              <h6>Original</h6>
              <div class="img-preview-box">
                <img id="originalImg" class="img-fluid rounded" alt="Original Preview">
              </div>
            </div>
            <div class="col-md-6 text-center">
              <h6>Enhanced</h6>
              <div class="img-preview-box">
                <img id="enhancedImg" class="img-fluid rounded" alt="Enhanced Preview">
              </div>
            </div>
          </div>

          <hr class="border-secondary my-4">

          <!-- Performance & Timing Breakdown -->
          <div class="row g-3 text-center" id="timingCards">
            <div class="col-3">
              <div class="p-2 border border-secondary rounded">
                <small class="text-secondary d-block">Host-to-Device</small>
                <span class="fw-bold" id="timeH2D">0.00 ms</span>
              </div>
            </div>
            <div class="col-3">
              <div class="p-2 border border-secondary rounded">
                <small class="text-secondary d-block">Kernel Execution</small>
                <span class="fw-bold text-info" id="timeKernel">0.00 ms</span>
              </div>
            </div>
            <div class="col-3">
              <div class="p-2 border border-secondary rounded">
                <small class="text-secondary d-block">Device-to-Host</small>
                <span class="fw-bold" id="timeD2H">0.00 ms</span>
              </div>
            </div>
            <div class="col-3">
              <div class="p-2 border border-secondary rounded">
                <small class="text-secondary d-block">Total Time</small>
                <span class="fw-bold text-success" id="timeTotal">0.00 ms</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
